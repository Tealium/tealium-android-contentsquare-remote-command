// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.9.23'
    ext.mockk_version = '1.13.9'
    ext.tealium_core_version = '1.9.2'
    ext.tealium_remotecommand_dispatcher_version = '1.5.3'
    ext.tealium_tagmanagement_dispatcher_version = '1.3.1'
    ext.tealium_lifecycle_version = '1.2.3'
    ext.tealium_contentsquare_version = '3.0.0'
    ext.contentsquare_version = ":[4.52.1, 5.0)"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        maven {
            url "https://maven.tealiumiq.com/android/releases/"
        }
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
