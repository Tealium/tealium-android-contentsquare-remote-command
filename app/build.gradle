apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.tealium.example"
    compileSdk 33

    defaultConfig {
        applicationId = "com.tealium.example"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode = 1
        versionName = "1.0"
        buildConfigField 'String', 'TAG', "\"App\""
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }


    buildFeatures {
        viewBinding true
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Tealium dependencies
    implementation "com.tealium:kotlin-core:$tealium_core_version"
    implementation "com.tealium:kotlin-lifecycle:$tealium_lifecycle_version"
    implementation "com.tealium:kotlin-remotecommand-dispatcher:$tealium_remotecommand_dispatcher_version"
    implementation "com.tealium:kotlin-tagmanagement-dispatcher:$tealium_tagmanagement_dispatcher_version"

    // ContentSquare integration
    releaseImplementation "com.tealium.remotecommands:contentsquare:$tealium_contentsquare_version"
    debugImplementation project(path: ':contentsquare')

    // AndroidX dependencies - kompatybilne wersje dla compileSdk 33
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
